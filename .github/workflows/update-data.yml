name: Update scoreboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch NCAA hockey scoreboards and SCSU calendar
        run: python scripts/update_data.py
      - name: Commit changes
        run: |
          git config user.name "scoreboard-bot"
          git config user.email "scoreboard-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update scoreboard data" && git push)
